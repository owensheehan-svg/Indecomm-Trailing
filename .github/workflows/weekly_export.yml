name: Weekly Airtable to Indecomm Export

on:
  schedule:
    # Mondays 9:00 UTC. Scheduled runs export the previous Mon-Sun by Funding Date.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Funding date start (YYYY-MM-DD, inclusive). Blank = previous Monday.'
        required: false
        default: ''
      end_date:
        description: 'Funding date end (YYYY-MM-DD, inclusive). Blank = previous Sunday.'
        required: false
        default: ''

concurrency:
  group: indecomm-weekly-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run export
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
          REDASH_QUERY_ID: ${{ secrets.REDASH_QUERY_ID }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python indecomm_export.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: funded-file-${{ github.run_number }}
          path: |
            Funded_File_*.xlsx
            processing_notes_*.txt
          retention-days: 30
